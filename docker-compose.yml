services:
  postgres:
    image: postgres:16-alpine
    container_name: agents-of-life-db
    environment:
      POSTGRES_USER: agents
      POSTGRES_PASSWORD: agents_local
      POSTGRES_DB: agents_of_life
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agents -d agents_of_life"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
